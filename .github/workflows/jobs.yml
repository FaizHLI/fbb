# Runs the league's background jobs (stats sync, lineup locks, waivers, weekly
# scoring) every hour, so the website can sleep on a free host.
# Needs repo secret DATABASE_URL. Optional: STATS_PROVIDER, BALLDONTLIE_API_KEY.
name: League jobs

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 (UTC)
  workflow_dispatch:        # "Run workflow" button in the Actions tab

concurrency:
  group: league-jobs
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m app.jobs tick
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STATS_PROVIDER: ${{ secrets.STATS_PROVIDER || 'nba_api' }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
